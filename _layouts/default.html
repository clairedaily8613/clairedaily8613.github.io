<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-logo">Claire Daily</a>
      <ul class="site-nav">
        <li><a href="{{ '/archive' | relative_url }}" {% if page.url contains 'archive' %}class="active"{% endif %}>旅途紀錄</a></li>
        <li><a href="https://newsletter.clairedaily.com/landingpagef" target="_blank">訂閱電子報</a></li>
      </ul>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <nav class="float-nav">
    <a href="{{ '/' | relative_url }}" class="float-nav-item {% if page.url == '/' %}active{% endif %}">首頁</a>
    <a href="{{ '/archive' | relative_url }}" class="float-nav-item {% if page.url contains 'archive' %}active{% endif %}">旅途紀錄</a>
    <a href="{{ '/categories' | relative_url }}" class="float-nav-item {% if page.url contains 'categories' %}active{% endif %}">分類</a>
  </nav>

  <footer class="site-footer">
    <div class="container">© {{ 'now' | date: "%Y" }} Claire Daily</div>
  </footer>
</body>
</html>
